<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiMo ASR 语音识别</title>
  <meta name="description" content="基于 MiMo-V2.5-ASR 的网页语音识别，支持流式输出与大文件浏览器端分段">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>MiMo ASR 语音识别</h1>
        <p class="sub">基于 MiMo-V2.5-ASR · 支持拖拽上传 · 流式输出</p>
      </div>
      <button id="settingsToggle" class="btn ghost" type="button">API 设置</button>
    </header>

    <section id="settingsPanel" class="panel settings hidden">
      <div class="grid">
        <label>
          <span>API 接口地址 (Base URL)</span>
          <input id="baseUrl" type="text" placeholder="https://api.xiaomimimo.com" spellcheck="false">
        </label>
        <label>
          <span>API Key</span>
          <input id="apiKey" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off">
        </label>
        <label>
          <span>模型 ID</span>
          <input id="modelId" type="text" placeholder="mimo-v2.5-asr" spellcheck="false">
        </label>
        <label>
          <span>请求模式</span>
          <select id="apiMode">
            <option value="direct">直连 API（默认）</option>
            <option value="proxy">同源代理 /api/proxy</option>
          </select>
        </label>
        <label>
          <span>识别语言</span>
          <select id="language">
            <option value="auto">自动检测</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <div class="settings-row">
        <label class="inline">
          <input id="streamMode" type="checkbox" checked>
          <span>流式输出（边识别边显示）</span>
        </label>
        <button id="saveSettings" class="btn" type="button">保存设置</button>
      </div>
      <p class="hint">设置保存在浏览器 localStorage，不会写入服务端；仅在识别请求中随报文转发。</p>
    </section>

    <section
      id="dropZone"
      class="dropzone"
      tabindex="0"
      role="button"
      aria-label="选择或拖拽音频文件"
    >
      <input id="fileInput" type="file" accept=".mp3,.wav,audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/*" hidden>
      <div class="dz-inner" id="dzInner">
        <div class="dz-icon">♪</div>
        <p class="dz-title">拖拽音频文件到此处，或点击选择</p>
        <p class="dz-hint">支持 mp3 / wav；大文件在浏览器端自动分段（无需服务端 ffmpeg）</p>
      </div>
      <div class="file-info hidden" id="fileInfo">
        <div class="file-name" id="fileName"></div>
        <div class="file-meta" id="fileMeta"></div>
      </div>
    </section>

    <div class="actions">
      <button id="transcribeBtn" class="btn primary" type="button" disabled>开始识别</button>
      <button id="cancelBtn" class="btn ghost hidden" type="button">取消</button>
      <button id="clearBtn" class="btn ghost" type="button">清空</button>
      <div id="status" class="status">等待上传音频</div>
    </div>

    <section class="panel result-panel">
      <div class="panel-head">
        <h2>识别结果</h2>
        <div class="usage" id="usage"></div>
      </div>
      <div id="resultText" class="result-text" contenteditable="true" data-placeholder="识别结果将显示在这里"></div>
      <div class="export-row">
        <button id="copyBtn" class="btn ghost" type="button">复制</button>
        <button id="exportTxt" class="btn ghost" type="button">下载 TXT</button>
        <button id="exportSrt" class="btn ghost" type="button">下载 SRT</button>
        <button id="exportJson" class="btn ghost" type="button">下载 JSON</button>
      </div>
    </section>

    <section class="panel history-panel">
      <div class="panel-head">
        <h2>历史记录</h2>
        <button id="clearHistory" class="btn ghost small" type="button">清空历史</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <p id="historyEmpty" class="hint">暂无历史记录</p>
    </section>

    <footer class="footer">
      纯静态版 · 可部署于 GitHub Pages / Cloudflare Pages · API Key 仅存于浏览器
    </footer>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
