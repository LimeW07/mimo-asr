services:
  mimo-asr:
    build: .
    image: mimo-asr:${TAG:-latest}
    container_name: mimo-asr
    ports:
      - "${ASR_PUBLISHED_PORT:-8000}:8000"
    environment:
      ASR_HOST: "0.0.0.0"
      ASR_PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
